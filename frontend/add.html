<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="./public/favicon.ico" type="image/x-icon">
    <title>Book Management System</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-book"></i> Books
        </div>

        <div class="nav-links">
            <a href="/"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/add.html" class="active"><i class="fa-solid fa-plus"></i> Add</a>
            <a href="/viewAll.html"><i class="fa-solid fa-book-open"></i> My Library</a>
        </div>
    </nav>

    <div class="container">

        <h1>Book Management System</h1>

        <div class="form-container">

            <h2>Add Book</h2>

            <form id="bookForm">

                <input type="text" id="title" placeholder="Book Title" required>

                <select id="author">
                    <option value="">Select Author</option>
                </select>

                <div id="newAuthorSection" class="new-author-section" style="display: none;">

                    <input type="text" id="newAuthorName" placeholder="Author name">
                    <input type="text" id="newAuthorQualification" placeholder="Qualification (e.g. MA English)">
                    <input type="date" id="newAuthorBirthDate">
                    <input type="text" id="newAuthorNationality" placeholder="Nationality">

                    <div class="new-author-actions">
                        <button type="button" id="saveNewAuthor">Save Author</button>
                        <button type="button" id="cancelNewAuthor">Cancel</button>
                    </div>

                </div>

                <input type="number" id="price" placeholder="Price" step="5" required>

                <input type="text" id="category" placeholder="Category" required>

                <input type="file" id="coverImage" accept="image/*">

                <button type="submit">Add Book</button>

            </form>

        </div>


    </div>

    <script type="module" src="js/main.js"></script>

</body>

</html>
