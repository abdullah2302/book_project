<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="description"
        content="Book Management System - Add, Search, and View Books. Manage your book collection with ease.">
    <title>Login - Book Manager</title>
    <link rel="icon" href="./public/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-book"></i>Books</div>
        <div class="nav-links">
            <a href="/"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
        </div>
    </nav>

    <div class="container">

        <h1>Login</h1>

        <div class="form-container">
            <div class="form-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
            <h2>Welcome Back</h2>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>

                <p class="form-switch">
                    Don't have an account? <a href="/register.html">Register here</a>
                </p>
            </form>
        </div>



    </div>

    <script type="module" src="js/main.js"></script>

</body>

</html>
