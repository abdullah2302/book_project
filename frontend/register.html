<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="description" content="Book Management System - Add, Search, and View Books. Manage your book collection with ease.">
    <title>Register - Book Manager</title>
    <link rel="icon" href="./public/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Books</div>
        <div class="nav-links">
            <a href="/">Home</a>

        </div>
    </nav>

    <div class="container">

        <h1>Register</h1>

        <div class="form-container">
            <div class="form-icon"><i class="fa-solid fa-user-plus"></i></div>
            <h2>Create an Account</h2>

            <form id="registerForm">
                <input type="text" id="registerUsername" placeholder="Username" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <select id="registerRole" required>
                    <option value="">Select Role</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit"><i class="fa-solid fa-user-plus"></i> Register</button>

                <p class="form-switch">
                    Already have an account? <a href="/login.html">Login here</a>
                </p>
            </form>
        </div>

    </div>

    <script type="module" src="js/main.js"></script>

</body>

</html>
