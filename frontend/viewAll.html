<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./public/favicon.ico" type="image/x-icon">
    
    <title>All Books</title>
   
</head>

<body>

    <nav class="navbar">

        <div class="logo">
             Books
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/add.html">Add</a>
            <a href="/viewAll.html" class="active">Actions</a>
            
        </div>

    </nav>

<div class="container">

    <h1>All Books</h1>

    <div class="filter-container">
        <div class="filter-group">
            <label for="viewAllSearch">Search by title</label>
            <input type="text" id="viewAllSearch" placeholder="Type book title...">
        </div>
    </div>

    <div class="books-container">
        <div id="booksList"></div>
    </div>

</div>


    
    <div id="editModalOverlay" class="modal-overlay">

        <div class="modal">

            <div class="modal-header">
                <h2>Edit Book</h2>
                <button type="button" id="closeEditModal" class="modal-close">&times;</button>
            </div>

            <form id="editForm">

                <input type="hidden" id="editId">

                <input type="text" id="editTitleInput" placeholder="Book Title" required>

                <input type="text" id="editAuthorInput" placeholder="Author" required>

                <input type="number" id="editPriceInput" placeholder="Price" required>

                <input type="text" id="editCategoryInput" placeholder="Category" required>

                <input type="file" id="editCoverImageInput" accept="image/*">

                <button type="submit">
                    Save Changes
                </button>

            </form>

        </div>

    </div>


    <script type="module" src="js/main.js"></script>

</body>

</html>
